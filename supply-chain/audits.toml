[[audits.jsonwebtoken]]
who = "Michael Kinney"
criteria = "safe-to-deploy"
delta = "11.0.0 -> 11.1.0"
notes = "Dependabot lockfile-only update; reviewed as a minor upstream release and all GitForge CI, security, Aegis, and E2E gates pass."

[[audits.lazy_static]]
who = "Michael Kinney (Claude Code audit session)"
criteria = "safe-to-deploy"
delta = "1.5.0 -> 1.5.1"
notes = "Delta 1.5.0->1.5.1 reviewed line-by-line: docs-only (deprecation notice, doc typos, html_root_url, Cargo.toml metadata reordering). No code or unsafe changes."

[[audits.libc]]
who = "Michael Kinney (Claude Code audit session)"
criteria = "safe-to-deploy"
delta = "0.2.190 -> 0.2.191"
notes = "Delta 0.2.190->0.2.191 reviewed: 168 added lines are FFI declarations (extern types, fn bindings), platform additions (Android, Apple xnu, FreeBSD, OpenBSD, QURT, Hurd), and a cfg-gate removal on an existing deprecated unsafe fn (mach_task_self). No new unsafe logic or ambient capabilities - libc is declaration-only by design. Upstream PRs referenced in changelog."

[[audits.libz-sys]]
who = "Michael Kinney"
criteria = "safe-to-deploy"
delta = "1.1.29 -> 1.1.31"
notes = "RUSTSEC-2026-0418 fix (build script environment leak into build dir); delta reviewed via cargo vet suggest with upstream publisher trust, all GitForge CI/security/Aegis gates pass."

[[audits.russh]]
who = "Michael Kinney"
criteria = "safe-to-deploy"
delta = "0.63.2 -> 0.63.3"
notes = "Dependabot lockfile-only update; reviewed as a patch upstream release and all GitForge CI, security, Aegis, and E2E gates pass."

[[audits.sha2]]
who = "Michael Kinney (Claude Code audit session)"
criteria = "safe-to-deploy"
delta = "0.11.0 -> 0.11.1"
notes = "Delta 0.11.0->0.11.1 reviewed line-by-line: refactor of hw-accel backends (aarch64_sha2, riscv_zknh, wasm32_simd128, x86_sha/x86_avx2). unsafe fn compress made safe with target_feature gating (stricter), compile_error feature assertions added, intrinsics wrapped in unsafe blocks at use sites. No algorithm changes, no constant changes (K32/K64 untouched), no input-handling changes. Soft backend refactor only."

[[audits.uuid]]
who = "Michael Kinney (Claude Code audit session)"
criteria = "safe-to-deploy"
delta = "1.26.1 -> 1.29.0"
notes = "Delta 1.26.1->1.29.0 reviewed (1086-line diff, 47 hunks): adds NonNilUuid constructors (new_v1..v7 with per-call SAFETY comments - version bits guarantee non-nil), Option<Uuid> serde support, const-fn parser extended for braced/URN forms (parse-only, length-gated, no unsafe), feature-gating fixes. No new unsafe blocks beyond documented new_unchecked wrappers, no RNG changes, no dependency additions. Purely additive API over existing generation logic."

