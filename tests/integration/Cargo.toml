[package]
name = "gitforge-integration-tests"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# Workspace crates
gitforge-common = { path = "../../crates/gitforge-common" }
gitforge-db = { path = "../../crates/gitforge-db" }
gitforge-ci = { path = "../../crates/gitforge-ci" }
gitforge-scheduler = { path = "../../crates/gitforge-scheduler" }
gitforge-runner = { path = "../../crates/gitforge-runner" }
gitforge-api = { path = "../../crates/gitforge-api" }

# External dependencies
axum = "0.8"
tower = "0.5"
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"

[dev-dependencies]
tokio-test = "0.4"