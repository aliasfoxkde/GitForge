[package]
name = "gitforge-integration-tests"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# Workspace crates
gitforce-common = { path = "../../crates/gitforce-common" }
gitforce-db = { path = "../../crates/gitforce-db" }
gitforce-ci = { path = "../../crates/gitforce-ci" }
gitforce-scheduler = { path = "../../crates/gitforce-scheduler" }
gitforce-runner = { path = "../../crates/gitforce-runner" }
gitforce-api = { path = "../../crates/gitforce-api" }

# External dependencies
axum = "0.7"
tower = "0.4"
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"

[dev-dependencies]
tokio-test = "0.4"