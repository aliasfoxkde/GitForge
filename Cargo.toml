[workspace]
resolver = "2"
members = [
    "crates/gitforce-common",
    "crates/gitforce-db",
    "crates/gitforce-events",
    "crates/gitforce-core",
    "crates/gitforce-ci",
    "crates/gitforce-process",
    "crates/gitforce-build",
    "crates/gitforce-scheduler",
    "crates/gitforce-runner",
    "crates/gitforce-sandbox",
    "crates/gitforce-storage",
    "crates/gitforce-api",
    "crates/gitforce-cli",
    "services/git-server",
    "services/ci",
    "services/runner",
    "services/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GitForge Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async traits
async-trait = "0.1"

# Utilities
futures = "0.3"
bytes = "1.6"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Docker client
bollard = "0.17"

# JWT
jsonwebtoken = "9"

# Password hashing
bcrypt = "0.15"

# Git
git2 = "0.19"

# Utils
lazy_static = "1.4"
hostname = "0.3"
tempfile = "3"

# CLI
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
