[workspace]
resolver = "2"
members = [
    "crates/gitforge-common",
    "crates/gitforge-db",
    "crates/gitforge-events",
    "crates/gitforge-core",
    "crates/gitforge-ci",
    "crates/gitforge-process",
    "crates/gitforge-build",
    "crates/gitforge-scheduler",
    "crates/gitforge-runner",
    "crates/gitforge-sandbox",
    "crates/gitforge-storage",
    "crates/gitforge-api",
    "crates/gitforge-cli",
    "crates/gitforge-ai",
    "crates/gitforge-review",
    "services/git-server",
    "services/ci",
    "services/runner",
    "services/api",
]
# The fuzz harness is its own nightly-only workspace (see fuzz/Cargo.toml);
# excluded so stable workspace commands never try to build it.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GitForge Team"]
license = "MIT"

# Workspace-wide lint foundation. Every crate opts in via `[lints]
# workspace = true`. Deliberately conservative: each entry here must stay
# clean under the CI clippy gate (`-D warnings`), so enforcement-grade
# restriction lints (unwrap_used, expect_used, panic) join only per-crate
# as the unwrap-elimination campaign drains each crate — the
# scripts/unwrap-count.sh metric tracks the drain.
[workspace.lints.rust]
rust_2018_idioms = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async traits
async-trait = "0.1"

# Utilities
futures = "0.3"
bytes = "1.6"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Docker client
bollard = "0.21"

# JWT
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }

# Password hashing
bcrypt = "0.19"

# Git
git2 = "0.21"

# Utils
lazy_static = "1.4"
hostname = "0.3"
tempfile = "3"

# CLI
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Selected pedantic lints promoted to workspace policy: mechanical to
# satisfy, and they keep formatting/Option-handling consistent. The rest of
# pedantic is surveyed in docs/audits and stays advisory. The warn entries
# are the 2026-10-10 anti-pattern guards (debug macros and unimplemented
# placeholders). The unwrap/expect campaign drained the production
# surface to zero undocumentated sites (2026-10-10 — see
# docs/planning/QUALITY_BASELINE.md), so the restriction lints are
# enforced workspace-wide; the three remaining expects carry per-site
# #[allow] with their invariants documented in place.
[workspace.lints.clippy]
uninlined_format_args = "deny"
map_unwrap_or = "deny"
redundant_closure_for_method_calls = "deny"
ignored_unit_patterns = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "warn"
unimplemented = "warn"
