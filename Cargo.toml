[workspace]
resolver = "2"
members = [
    "crates/gitforge-common",
    "crates/gitforge-db",
    "crates/gitforge-events",
    "crates/gitforge-core",
    "crates/gitforge-ci",
    "crates/gitforge-process",
    "crates/gitforge-build",
    "crates/gitforge-scheduler",
    "crates/gitforge-runner",
    "crates/gitforge-sandbox",
    "crates/gitforge-storage",
    "crates/gitforge-api",
    "crates/gitforge-cli",
    "crates/gitforge-ai",
    "crates/gitforge-review",
    "services/git-server",
    "services/ci",
    "services/runner",
    "services/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GitForge Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async traits
async-trait = "0.1"

# Utilities
futures = "0.3"
bytes = "1.6"
base64 = "0.22"
sha2 = "0.11"
hex = "0.4"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Docker client
bollard = "0.16"

# JWT
# Use jsonwebtoken's aws-lc-rs backend; the optional rust_crypto backend pulls
# in RSA 0.9, which has no patched release for the Marvin timing advisory.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }

# Password hashing
bcrypt = "0.19"

# Git
git2 = "0.21"

# Utils
lazy_static = "1.4"
hostname = "0.3"
tempfile = "3"

# CLI
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
