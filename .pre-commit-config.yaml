# GitForge pre-commit configuration
# ─────────────────────────────────────────────────────────────────────────────
# Installation: pip install pre-commit && pre-commit install
#
# The Rust gates (cargo fmt --check + strict clippy) live in the git
# pre-commit hook (.githooks/pre-commit, installed by `make setup`), which
# is staged-file-gated so docs-only commits stay fast. This framework layer
# runs the repo-generic hygiene hooks.
# ─────────────────────────────────────────────────────────────────────────────
repos:
  # ─── Local Rust hooks ───────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: '\.rs$'

  # ─── Remote hooks ───────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']

      - id: end-of-file-fixer

      - id: check-yaml
        args: ['--allow-multiple-documents']

      - id: check-added-large-files
        args: ['--maxkb=1000']

      - id: check-merge-conflict

      - id: check-case-conflict

      - id: detect-private-key
        exclude: '^tests/fixtures/'

      - id: detect-aws-credentials
        exclude: '^tests/fixtures/'

      - id: mixed-line-ending
        args: ['--fix=no']
        description: Detect and report mixed line endings (does not fix)
