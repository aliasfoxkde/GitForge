[package]
name = "gitforge-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
gitforge-common = { path = "../gitforge-common" }
gitforge-review = { path = "../gitforge-review" }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

# SQLite for MVP - embedded, no server needed
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json"] }

# Refresh-credential digest computation (see RefreshTokenQueries::credential_digest)
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
