[package]
name = "gitforge-scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
gitforge-common = { path = "../gitforge-common" }
gitforge-db = { path = "../gitforge-db" }
gitforge-storage = { path = "../gitforge-storage" }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }

[dev-dependencies]
# Paused-time tests: the durable-write retry loop sleeps 2 s between
# attempts; auto-advance keeps the exhaustion test out of real wall time.
tokio = { workspace = true, features = ["test-util", "macros"] }

[lints]
workspace = true
