[package]
name = "gitforge-testing-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared test fixtures, generators, and assertion helpers for GitForge crates"

[dependencies]
tempfile = { workspace = true }
# v5 adds the name-based (deterministic) uuids the seeded generators use;
# the feature unions with the workspace's v4/serde set.
uuid = { workspace = true, features = ["v5"] }
chrono = { workspace = true }

[lints]
workspace = true
