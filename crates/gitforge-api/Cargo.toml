[package]
name = "gitforge-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
gitforge-common = { path = "../gitforge-common" }
gitforge-core = { path = "../gitforge-core" }
gitforge-db = { path = "../gitforge-db" }
gitforge-events = { path = "../gitforge-events" }
gitforge-ci = { path = "../gitforge-ci" }
gitforge-scheduler = { path = "../gitforge-scheduler" }
gitforge-storage = { path = "../gitforge-storage" }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.7", features = ["cors", "trace"] }
async-trait = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
reqwest = { workspace = true }
# OpenSSH public key parsing/fingerprinting for the per-user SSH key
# registry. Exact pin matches the transport's (russh) so only one copy of
# the crate exists in the tree.
ssh-key = "=0.7.0-rc.11"

# Prometheus metrics
prometheus = "0.14"

[dev-dependencies]
hyper = "1.5"
tempfile = "3"
gitforge-review = { path = "../gitforge-review" }

[features]
# Test-only surface for the CI trigger delegation seam: the transport
# injection trait, `CiTriggerClient::with_transport`, and the test-only
# `with_test_endpoint` constructor. Ordinary production builds never
# enable it, so no injection path is compiled into `cargo build` /
# `--release`. The integration suites that exercise the seam declare it
# as a required feature below, so plain `cargo test` skips those targets
# instead of failing to compile while CI enables the feature explicitly
# (see .gitforce.yml and the GitHub workflows).
test-util = []

[[test]]
name = "ci_routes"
required-features = ["test-util"]

[[test]]
name = "webhook_routes"
required-features = ["test-util"]

[lints]
workspace = true
