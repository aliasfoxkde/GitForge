[package]
name = "gitforce-ai"
version = "0.1.0"
edition = "2021"
description = "AI provider interface for GitForge"
authors = ["GitForge Team"]

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
