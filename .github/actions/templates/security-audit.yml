# GitForge CI - Security Audit Template
# Standard security scanning workflow for projects using GitForge CI

name: Security Audit

on:
  workflow_call:
    inputs:
      audit_level:
        description: 'Audit level (advisory, yanked, all)'
        required: false
        default: 'advisory'
    secrets:
      GH_TOKEN:
        required: false

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Run cargo-audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GH_TOKEN }}

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -nE 'gh[pousr]_[0-9A-Za-z]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{20,}' -- ':!*.lock' ':!.github/ISSUE_TEMPLATE/**' || true)
          if [[ -n "$matches" ]]; then
            echo "Potential credential material found in tracked files:" >&2
            echo "$matches" >&2
            exit 1
          fi
          echo "No known credential patterns found."

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          languages: rust

      - name: Build
        run: cargo build --workspace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          category: "/language:rust"
