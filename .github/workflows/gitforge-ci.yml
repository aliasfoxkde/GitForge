name: GitForge CI

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/**'

env:
  GITFORGE_API_URL: ${{ vars.GITFORGE_API_URL || 'http://localhost:42780' }}
  GITFORGE_RUN_STATUS_URL: ${{ vars.GITFORGE_RUN_STATUS_URL || '' }}
  GITFORGE_POLL_TIMEOUT_SECONDS: ${{ vars.GITFORGE_POLL_TIMEOUT_SECONDS || '1800' }}
  GITFORGE_POLL_INTERVAL_SECONDS: ${{ vars.GITFORGE_POLL_INTERVAL_SECONDS || '15' }}
  GITFORGE_API_TOKEN: ${{ secrets.GITFORGE_API_TOKEN }}

# Route ALL builds through GitForge instead of running directly on GitHub Actions runners.
# This prevents build storms and zombie processes by using GitForge's build queue.

jobs:
  # Enqueue build job to GitForge queue instead of running directly
  enqueue-build:
    name: Enqueue Build to GitForge
    runs-on: ubuntu-latest
    outputs:
      job_id: ${{ steps.enqueue.outputs.job_id }}
      build_status: ${{ steps.enqueue.outputs.status }}
    steps:
      - name: Validate GitForge configuration
        run: |
          set -euo pipefail
          : "${GITFORGE_API_URL:?GITFORGE_API_URL is required}"
          : "${GITFORGE_API_TOKEN:?GITFORGE_API_TOKEN is required}"
          [[ "$GITFORGE_POLL_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "GITFORGE_POLL_TIMEOUT_SECONDS must be a positive integer" >&2
            exit 1
          }
          [[ "$GITFORGE_POLL_INTERVAL_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "GITFORGE_POLL_INTERVAL_SECONDS must be a positive integer" >&2
            exit 1
          }
      - name: Enqueue build job
        id: enqueue
        run: |
          set -euo pipefail
          # Call GitForge webhook API to enqueue build job
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$GITFORGE_API_URL/api/webhook/trigger/${{ github.event.repository.id }}" \
            -H "Authorization: Bearer $GITFORGE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "repo_id": "${{ github.repository_id }}",
              "commit_hash": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "pipeline_name": "rust-ci"
            }' 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            JOB_ID=$(echo "$BODY" | jq -r '.pipeline_id // empty')
            if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "null" ]; then
              echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
              echo "status=enqueued" >> $GITHUB_OUTPUT
              echo "Successfully enqueued job $JOB_ID"
              exit 0
            fi
          fi

          echo "GitForge enqueue failed (HTTP $HTTP_CODE); refusing to bypass GitForge" >&2
          exit 1

  # Poll GitForge for build status (when GitForge is available)
  poll-build:
    name: Poll GitForge Build Status
    needs: enqueue-build
    if: needs.enqueue-build.outputs.build_status == 'enqueued'
    runs-on: ubuntu-latest
    outputs:
      terminal_status: ${{ steps.poll.outputs.terminal_status }}
    steps:
      - name: Poll for build completion
        id: poll
        run: |
          set -euo pipefail
          echo "Build enqueued, polling GitForge for status..."
          JOB_ID='${{ needs.enqueue-build.outputs.job_id }}'
          STATUS_URL="$GITFORGE_RUN_STATUS_URL"
          if [ -z "$STATUS_URL" ]; then
            STATUS_URL="$GITFORGE_API_URL/api/jobs/$JOB_ID/status"
          else
            STATUS_URL="${STATUS_URL//\{job_id\}/$JOB_ID}"
          fi

          deadline=$(( $(date +%s) + GITFORGE_POLL_TIMEOUT_SECONDS ))
          while :; do
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
              -H "Authorization: Bearer $GITFORGE_API_TOKEN" \
              -H "Accept: application/json" \
              "$STATUS_URL")
            STATUS=$(echo "$RESPONSE" | jq -r '.status // .state // empty' | tr '[:upper:]' '[:lower:]')
            echo "GitForge job $JOB_ID status: ${STATUS:-unknown}"

            case "$STATUS" in
              completed|succeeded|success|passed|failed|failure|cancelled|canceled|timed_out|timeout|error)
                echo "terminal_status=$STATUS" >> "$GITHUB_OUTPUT"
                case "$STATUS" in
                  completed|succeeded|success|passed) exit 0 ;;
                  *) echo "GitForge job reached unsuccessful terminal state: $STATUS" >&2; exit 1 ;;
                esac
                ;;
              *)
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "GitForge job did not reach a terminal state within ${GITFORGE_POLL_TIMEOUT_SECONDS}s" >&2
                  echo "terminal_status=timeout" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
                sleep "$GITFORGE_POLL_INTERVAL_SECONDS"
                ;;
            esac
          done

  # Report final status to GitHub
  report-status:
    name: Report Build Status
    needs: [enqueue-build, poll-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report completion
        run: |
          echo "GitForge enqueue status: ${{ needs.enqueue-build.outputs.build_status }}"
          echo "GitForge poll job result: ${{ needs.poll-build.result }}"
          echo "GitForge terminal status: ${{ needs.poll-build.outputs.terminal_status || 'not-reached' }}"
          if [ "${{ needs.poll-build.result }}" != "success" ]; then
            echo "GitForge CI did not complete successfully" >&2
            exit 1
          fi
