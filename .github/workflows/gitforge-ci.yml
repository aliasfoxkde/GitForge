name: GitForge CI

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub-hosted runners cannot reach a private Fedora LAN address. Enable
  # this workflow only after a reachable endpoint or self-hosted runner is
  # deliberately configured at repository/organization scope.
  GITFORGE_ENABLED: ${{ vars.GITFORGE_ENABLED || 'false' }}
  GITFORGE_SCHEDULER_URL: ${{ vars.GITFORGE_SCHEDULER_URL || '' }}
  GITFORGE_REPO_ID: ${{ vars.GITFORGE_REPO_ID || '' }}
  GITFORGE_POLL_TIMEOUT_SECONDS: ${{ vars.GITFORGE_POLL_TIMEOUT_SECONDS || '1800' }}
  GITFORGE_POLL_INTERVAL_SECONDS: ${{ vars.GITFORGE_POLL_INTERVAL_SECONDS || '15' }}
  # Trigger and status credentials are distinct on purpose (issue #259).
  # GITFORGE_TRIGGER_TOKEN starts runs (POST /pipelines/trigger). During the
  # migration to dedicated tokens the CI service still accepts its scheduler
  # operator/shared token names as trigger credentials there
  # (configured_trigger_token in services/ci), so the operator token must be
  # treated as trigger-capable; this workflow requires the dedicated secret
  # so its credential survives that fallback's removal. The reverse is
  # enforced: GITFORGE_STATUS_TOKEN is honored only under its own name at
  # GET /pipelines/trigger/status/{event_id}. This workflow only ever polls
  # the event id its own trigger call returned, but that scoping lives in
  # this workflow, not in the service: status authorization is a shared-token
  # trust boundary. The service does not bind the status token to the event
  # id or to the repository, so any caller holding the token can read the
  # lifecycle state of any stored event by UUID — UUID secrecy is not a
  # substitute for token auth. Per-event/per-repository (multi-tenant)
  # authorization on the status endpoint is future work if a deployment
  # needs it. The API gateway JWT is not part of this loop: status is
  # answered by the CI service itself, so GITFORGE_API_URL/GITFORGE_API_TOKEN
  # are no longer used.
  GITFORGE_TRIGGER_TOKEN: ${{ secrets.GITFORGE_TRIGGER_TOKEN }}
  GITFORGE_STATUS_TOKEN: ${{ secrets.GITFORGE_STATUS_TOKEN }}

permissions:
  contents: read

# Route ALL builds through GitForge instead of running directly on GitHub Actions runners.
# This prevents build storms and zombie processes by using GitForge's build queue.

jobs:
  # Enqueue build job to GitForge queue instead of running directly
  enqueue-build:
    name: Enqueue Build to GitForge
    if: vars.GITFORGE_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, gitforge-github]
    outputs:
      event_id: ${{ steps.enqueue.outputs.event_id }}
      run_id: ${{ steps.enqueue.outputs.run_id }}
      build_status: ${{ steps.enqueue.outputs.status }}
    steps:
      - name: Validate GitForge configuration
        run: |
          set -euo pipefail
          # Canonical 8-4-4-4-12 hexadecimal UUID shape. Stronger than the
          # former "36 chars of hex or hyphen" test, which accepted malformed
          # forms such as 32 hex digits with no separators at all.
          UUID_RE='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          : "${GITFORGE_SCHEDULER_URL:?GITFORGE_SCHEDULER_URL is required}"
          : "${GITFORGE_REPO_ID:?GITFORGE_REPO_ID is required (GitForge UUID, not GitHub repository_id)}"
          : "${GITFORGE_TRIGGER_TOKEN:?GITFORGE_TRIGGER_TOKEN secret is required (starts runs: POST /pipelines/trigger)}"
          : "${GITFORGE_STATUS_TOKEN:?GITFORGE_STATUS_TOKEN secret is required (reads trigger status: GET /pipelines/trigger/status/{event_id}); it must be a distinct, high-entropy credential, not the trigger or operator token}"
          [[ "$GITFORGE_REPO_ID" =~ $UUID_RE ]] || {
            echo "GITFORGE_REPO_ID must be a canonical UUID (8-4-4-4-12 hex)" >&2
            exit 1
          }
          [[ "$GITFORGE_POLL_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "GITFORGE_POLL_TIMEOUT_SECONDS must be a positive integer" >&2
            exit 1
          }
          [[ "$GITFORGE_POLL_INTERVAL_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "GITFORGE_POLL_INTERVAL_SECONDS must be a positive integer" >&2
            exit 1
          }
          [[ "$GITFORGE_TRIGGER_TOKEN" != "$GITFORGE_STATUS_TOKEN" ]] || {
            echo "GITFORGE_TRIGGER_TOKEN and GITFORGE_STATUS_TOKEN must be distinct credentials (issue #259)" >&2
            exit 1
          }
      - name: Enqueue build job
        id: enqueue
        run: |
          set -euo pipefail
          UUID_RE='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          # Trigger the GitForge CI service. The response always carries the
          # durable event id; it also carries the pipeline-run id once the
          # service's correlation window (15s) succeeds. When it answers
          # `queued` without a run id, the poll job resolves the run from the
          # event id — the correlation is durable, so the answer survives
          # service restarts.
          PAYLOAD=$(jq -n \
            --arg repo "$GITFORGE_REPO_ID" \
            --arg ref "${{ github.ref_name }}" \
            --arg old "${{ github.event.before }}" \
            --arg new "${{ github.sha }}" \
            '{repo_id:$repo,ref_name:$ref,old_hash:$old,new_hash:$new,working_dir:null}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$GITFORGE_SCHEDULER_URL/pipelines/trigger" \
            -H "Authorization: Bearer $GITFORGE_TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            EVENT_ID=$(echo "$BODY" | jq -r '.event_id // empty')
            RUN_ID=$(echo "$BODY" | jq -r '.pipeline_run_id // empty')
            if [ -n "$EVENT_ID" ] && [ "$EVENT_ID" != "null" ]; then
              # These ids become workflow outputs consumed by later jobs, so
              # only a canonical 8-4-4-4-12 hexadecimal UUID may pass: a
              # crafted trigger response must never be able to smuggle shell
              # into a consumer step.
              [[ "$EVENT_ID" =~ $UUID_RE ]] || {
                echo "trigger response event_id is not a canonical UUID (8-4-4-4-12 hex); refusing to continue" >&2
                exit 1
              }
              echo "event_id=$EVENT_ID" >> "$GITHUB_OUTPUT"
              if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
                [[ "$RUN_ID" =~ $UUID_RE ]] || {
                  echo "trigger response pipeline_run_id is not a canonical UUID (8-4-4-4-12 hex); refusing to continue" >&2
                  exit 1
                }
                echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              fi
              echo "status=enqueued" >> "$GITHUB_OUTPUT"
              echo "Trigger accepted: event $EVENT_ID${RUN_ID:+, run $RUN_ID}"
              exit 0
            fi
            echo "GitForge trigger response carried no event_id; refusing to continue" >&2
          else
            echo "GitForge enqueue failed (HTTP $HTTP_CODE); refusing to bypass GitForge" >&2
            echo "$BODY" | jq -r '.error // "unparsed error body"' >&2 || true
          fi
          exit 1

  # Poll GitForge for build status (when GitForge is available)
  poll-build:
    name: Poll GitForge Build Status
    needs: enqueue-build
    if: needs.enqueue-build.outputs.build_status == 'enqueued'
    runs-on: [self-hosted, linux, x64, gitforge-github]
    outputs:
      terminal_status: ${{ steps.poll.outputs.terminal_status }}
    steps:
      - name: Poll for build completion
        id: poll
        env:
          EVENT_ID: ${{ needs.enqueue-build.outputs.event_id }}
        run: |
          set -euo pipefail
          # The event id reaches this script as an environment variable, not
          # as an inline expression: a malformed value can only fail the
          # validation below, never terminate out of the quoted context.
          UUID_RE='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$EVENT_ID" =~ $UUID_RE ]] || {
            echo "enqueue did not yield a canonical event id (8-4-4-4-12 hex): refusing to poll" >&2
            exit 1
          }
          # Status reads use the dedicated status credential against the CI
          # service. The URL is built from the event id this run's own trigger
          # call returned (#259) — that scoping is this workflow's behavior,
          # not a service guarantee: status authorization is a shared-token
          # trust boundary, so the event id is not a capability and its
          # secrecy is no substitute for the token check below.
          STATUS_URL="$GITFORGE_SCHEDULER_URL/pipelines/trigger/status/$EVENT_ID"
          STATUS_FILE="$RUNNER_TEMP/gitforge-trigger-status.json"
          echo "Build enqueued as event $EVENT_ID, polling GitForge for status..."

          deadline=$(( $(date +%s) + GITFORGE_POLL_TIMEOUT_SECONDS ))
          while :; do
            HTTP_CODE=$(curl --silent --show-error --max-time 30 \
              -o "$STATUS_FILE" -w "%{http_code}" \
              -H "Authorization: Bearer $GITFORGE_STATUS_TOKEN" \
              -H "Accept: application/json" \
              "$STATUS_URL")
            case "$HTTP_CODE" in
              200)
                # Fail closed: an unreadable or unrecognized body is never
                # treated as success, and only `succeeded` is green.
                STATUS=$(jq -r '.status // empty' "$STATUS_FILE" 2>/dev/null || true)
                RUN_ID=$(jq -r '.pipeline_run_id // empty' "$STATUS_FILE" 2>/dev/null || true)
                echo "GitForge event $EVENT_ID status: ${STATUS:-unknown}${RUN_ID:+ (run $RUN_ID)}"
                case "$STATUS" in
                  succeeded)
                    echo "terminal_status=succeeded" >> "$GITHUB_OUTPUT"
                    exit 0
                    ;;
                  failed|cancelled|canceled|timed_out|timeout|error)
                    echo "GitForge pipeline reached unsuccessful terminal state: $STATUS" >&2
                    echo "terminal_status=$STATUS" >> "$GITHUB_OUTPUT"
                    exit 1
                    ;;
                  queued|running|pending|assigned)
                    : # not terminal; keep polling
                    ;;
                  *)
                    echo "GitForge returned unrecognized status '${STATUS:-<none>}'; refusing to guess" >&2
                    echo "terminal_status=invalid" >> "$GITHUB_OUTPUT"
                    exit 1
                    ;;
                esac
                ;;
              404)
                echo "GitForge has no durable correlation for event $EVENT_ID; treating as failure" >&2
                echo "terminal_status=missing" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
              401|403)
                echo "GitForge rejected the status credential (HTTP $HTTP_CODE); check the GITFORGE_STATUS_TOKEN secret" >&2
                exit 1
                ;;
              *)
                echo "GitForge status endpoint answered HTTP $HTTP_CODE" >&2
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "GitForge pipeline run did not reach a terminal state within ${GITFORGE_POLL_TIMEOUT_SECONDS}s" >&2
              echo "terminal_status=timeout" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            sleep "$GITFORGE_POLL_INTERVAL_SECONDS"
          done

  # Report final status to GitHub
  report-status:
    name: Report Build Status
    needs: [enqueue-build, poll-build]
    if: always() && vars.GITFORGE_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, gitforge-github]
    steps:
      - name: Report completion
        env:
          EVENT_ID: ${{ needs.enqueue-build.outputs.event_id }}
        run: |
          echo "GitForge enqueue status: ${{ needs.enqueue-build.outputs.build_status }}"
          echo "GitForge event id: ${EVENT_ID}"
          echo "GitForge poll job result: ${{ needs.poll-build.result }}"
          echo "GitForge terminal status: ${{ needs.poll-build.outputs.terminal_status || 'not-reached' }}"
          if [ "${{ needs.poll-build.result }}" != "success" ]; then
            echo "GitForge CI did not complete successfully" >&2
            exit 1
          fi
