name: GitForge CI

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub-hosted runners cannot reach a private Fedora LAN address. Enable
  # this workflow only after a reachable endpoint or self-hosted runner is
  # deliberately configured at repository/organization scope.
  GITFORGE_ENABLED: ${{ vars.GITFORGE_ENABLED || 'false' }}
  GITFORGE_SCHEDULER_URL: ${{ vars.GITFORGE_SCHEDULER_URL || '' }}
  GITFORGE_REPO_ID: ${{ vars.GITFORGE_REPO_ID || '' }}
  GITFORGE_POLL_TIMEOUT_SECONDS: ${{ vars.GITFORGE_POLL_TIMEOUT_SECONDS || '1800' }}
  GITFORGE_POLL_INTERVAL_SECONDS: ${{ vars.GITFORGE_POLL_INTERVAL_SECONDS || '15' }}
  GITFORGE_CI_TRIGGER_TOKEN: ${{ secrets.GITFORGE_CI_TRIGGER_TOKEN }}
  GITFORGE_SCHEDULER_OPERATOR_TOKEN: ${{ secrets.GITFORGE_SCHEDULER_OPERATOR_TOKEN }}

permissions:
  contents: read

# Route ALL builds through GitForge instead of running directly on GitHub Actions runners.
# This prevents build storms and zombie processes by using GitForge's build queue.

jobs:
  # Enqueue build job to GitForge queue instead of running directly
  enqueue-build:
    name: Enqueue Build to GitForge
    if: vars.GITFORGE_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, gitforge-github]
    outputs:
      run_id: ${{ steps.enqueue.outputs.run_id }}
      trigger_event_id: ${{ steps.enqueue.outputs.trigger_event_id }}
      build_status: ${{ steps.enqueue.outputs.status }}
    steps:
      - name: Validate GitForge configuration
        run: |
          set -euo pipefail
          : "${GITFORGE_SCHEDULER_URL:?GITFORGE_SCHEDULER_URL is required}"
          : "${GITFORGE_REPO_ID:?GITFORGE_REPO_ID is required (GitForge UUID, not GitHub repository_id)}"
          : "${GITFORGE_CI_TRIGGER_TOKEN:?GITFORGE_CI_TRIGGER_TOKEN is required}"
          : "${GITFORGE_SCHEDULER_OPERATOR_TOKEN:?GITFORGE_SCHEDULER_OPERATOR_TOKEN is required}"
          [[ "$GITFORGE_REPO_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "GITFORGE_REPO_ID must be a UUID" >&2
            exit 1
          }
          [[ "$GITFORGE_POLL_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "GITFORGE_POLL_TIMEOUT_SECONDS must be a positive integer" >&2
            exit 1
          }
          [[ "$GITFORGE_POLL_INTERVAL_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "GITFORGE_POLL_INTERVAL_SECONDS must be a positive integer" >&2
            exit 1
          }
      - name: Enqueue build job
        id: enqueue
        env:
          GITFORGE_TRIGGER_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          GITFORGE_TRIGGER_OLD: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITFORGE_TRIGGER_NEW: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Trigger the GitForge CI service. The service returns the durable
          # pipeline-run ID; polling the API by pipeline ID was a protocol
          # mismatch and could never observe the created run.
          # pull_request's github.sha is a synthetic refs/pull/<n>/merge
          # commit that is not present in GitForge's mirrored branch refs.
          # Send the actual PR branch and head SHA; push events keep their
          # normal ref/before/after values.
          PAYLOAD=$(jq -n \
            --arg repo "$GITFORGE_REPO_ID" \
            --arg ref "$GITFORGE_TRIGGER_REF" \
            --arg old "$GITFORGE_TRIGGER_OLD" \
            --arg new "$GITFORGE_TRIGGER_NEW" \
            '{repo_id:$repo,ref_name:$ref,old_hash:$old,new_hash:$new,working_dir:null}')
          RESPONSE=$(curl -s --max-time 30 -w "\n%{http_code}" -X POST \
            "$GITFORGE_SCHEDULER_URL/pipelines/trigger" \
            -H "Authorization: Bearer $GITFORGE_CI_TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY"

          # A 2xx response with an event id means the trigger endpoint accepted
          # the request, but does not itself prove durable event delivery. If
          # the run was not created within the correlation window, poll-build
          # resolves the run by polling trigger status; a present
          # pipeline_run_id skips that phase entirely.
          case "$HTTP_CODE" in
            2*)
              RUN_ID=$(echo "$BODY" | jq -r '.pipeline_run_id // empty')
              if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
                echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                echo "status=enqueued" >> "$GITHUB_OUTPUT"
                echo "Successfully enqueued pipeline run $RUN_ID"
                exit 0
              fi
              EVENT_ID=$(echo "$BODY" | jq -r '.event_id // empty')
              if [ -n "$EVENT_ID" ] && [ "$EVENT_ID" != "null" ]; then
                echo "trigger_event_id=$EVENT_ID" >> "$GITHUB_OUTPUT"
                echo "status=queued" >> "$GITHUB_OUTPUT"
                echo "Trigger accepted; waiting for pipeline run (event $EVENT_ID)"
                exit 0
              fi
              ;;
          esac

          echo "GitForge enqueue failed (HTTP $HTTP_CODE); refusing to bypass GitForge" >&2
          exit 1

  # Poll GitForge for build status (when GitForge is available)
  poll-build:
    name: Poll GitForge Build Status
    needs: enqueue-build
    if: needs.enqueue-build.outputs.build_status == 'enqueued' || needs.enqueue-build.outputs.build_status == 'queued'
    runs-on: [self-hosted, linux, x64, gitforge-github]
    outputs:
      terminal_status: ${{ steps.poll.outputs.terminal_status }}
    steps:
      - name: Poll for build completion
        id: poll
        env:
          GITFORGE_TRIGGER_EVENT_ID: ${{ needs.enqueue-build.outputs.trigger_event_id }}
        run: |
          set -euo pipefail
          RUN_ID='${{ needs.enqueue-build.outputs.run_id }}'
          # One end-to-end deadline covers both correlation and run polling.
          deadline=$(( $(date +%s) + GITFORGE_POLL_TIMEOUT_SECONDS ))

          # Phase 1: resolve a queued trigger into its pipeline run. The
          # trigger POST was accepted and is durable (an event id was
          # returned), but the run had not been created within the
          # orchestrator's correlation window. Poll the read-only trigger
          # status endpoint until the run id appears, the trigger reaches a
          # terminal failure, or the overall configured timeout elapses.
          if [ '${{ needs.enqueue-build.outputs.build_status }}' = 'queued' ]; then
            : "${GITFORGE_TRIGGER_EVENT_ID:?queued trigger requires trigger_event_id}"
            TRIGGER_URL="$GITFORGE_SCHEDULER_URL/pipelines/trigger/$GITFORGE_TRIGGER_EVENT_ID"
            while :; do
              # curl failures (network hiccups) must be retried, not fatal.
              RESPONSE=$(curl --silent --show-error --max-time 30 \
                -w "\n%{http_code}" \
                -H "Authorization: Bearer $GITFORGE_SCHEDULER_OPERATOR_TOKEN" \
                -H "Accept: application/json" \
                "$TRIGGER_URL" 2>&1) || RESPONSE=$'\n000'
              HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | sed '$d')

              case "$HTTP_CODE" in
                2*)
                  RUN_ID=$(echo "$BODY" | jq -r '.pipeline_run_id // empty')
                  if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
                    echo "Queued trigger $GITFORGE_TRIGGER_EVENT_ID resolved to pipeline run $RUN_ID"
                    break
                  fi
                  TRIGGER_STATUS=$(echo "$BODY" | jq -r '.status // empty' | tr '[:upper:]' '[:lower:]')
                  if [ "$TRIGGER_STATUS" = "failed" ]; then
                    echo "GitForge trigger $GITFORGE_TRIGGER_EVENT_ID failed terminally: $(echo "$BODY" | jq -r '.error // "unknown error"')" >&2
                    echo "terminal_status=failed" >> "$GITHUB_OUTPUT"
                    exit 1
                  fi
                  echo "GitForge trigger $GITFORGE_TRIGGER_EVENT_ID status: ${TRIGGER_STATUS:-unknown}; run not yet created"
                  ;;
                401|403)
                  echo "GitForge rejected the operator credential for trigger status (HTTP $HTTP_CODE)" >&2
                  exit 1
                  ;;
                *)
                  echo "GitForge trigger status not readable yet (HTTP $HTTP_CODE)"
                  ;;
              esac

              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "GitForge trigger $GITFORGE_TRIGGER_EVENT_ID did not produce a pipeline run within ${GITFORGE_POLL_TIMEOUT_SECONDS}s" >&2
                echo "terminal_status=timeout" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              sleep "$GITFORGE_POLL_INTERVAL_SECONDS"
            done
          fi

          echo "Build enqueued, polling GitForge for status..."
          STATUS_URL="$GITFORGE_SCHEDULER_URL/pipelines/runs/$RUN_ID"

          while :; do
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              --max-time 30 \
              -H "Authorization: Bearer $GITFORGE_SCHEDULER_OPERATOR_TOKEN" \
              -H "Accept: application/json" \
              "$STATUS_URL")
            STATUS=$(echo "$RESPONSE" | jq -r '.status // .state // empty' | tr '[:upper:]' '[:lower:]')
            echo "GitForge pipeline run $RUN_ID status: ${STATUS:-unknown}"

            case "$STATUS" in
              completed|succeeded|success|passed|failed|failure|cancelled|canceled|timed_out|timeout|error)
                echo "terminal_status=$STATUS" >> "$GITHUB_OUTPUT"
                case "$STATUS" in
                  completed|succeeded|success|passed) exit 0 ;;
                  *) echo "GitForge job reached unsuccessful terminal state: $STATUS" >&2; exit 1 ;;
                esac
                ;;
              *)
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "GitForge pipeline run did not reach a terminal state within ${GITFORGE_POLL_TIMEOUT_SECONDS}s" >&2
                  echo "terminal_status=timeout" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
                sleep "$GITFORGE_POLL_INTERVAL_SECONDS"
                ;;
            esac
          done

  # Report final status to GitHub
  report-status:
    name: Report Build Status
    needs: [enqueue-build, poll-build]
    if: always() && vars.GITFORGE_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, gitforge-github]
    steps:
      - name: Report completion
        run: |
          echo "GitForge enqueue status: ${{ needs.enqueue-build.outputs.build_status }}"
          echo "GitForge poll job result: ${{ needs.poll-build.result }}"
          echo "GitForge terminal status: ${{ needs.poll-build.outputs.terminal_status || 'not-reached' }}"
          if [ "${{ needs.poll-build.result }}" != "success" ]; then
            echo "GitForge CI did not complete successfully" >&2
            exit 1
          fi
