name: GitForge CI

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub-hosted runners cannot reach a private Fedora LAN address. Enable
  # this workflow only after a reachable endpoint or self-hosted runner is
  # deliberately configured at repository/organization scope.
  GITFORGE_ENABLED: ${{ vars.GITFORGE_ENABLED || 'false' }}
  GITFORGE_SCHEDULER_URL: ${{ vars.GITFORGE_SCHEDULER_URL || '' }}
  GITFORGE_REPO_ID: ${{ vars.GITFORGE_REPO_ID || '' }}
  # Git HTTP URL of the SAME repository on the GitForge instance (the repo
  # behind GITFORGE_REPO_ID). The bridge pushes the event's commit here
  # before triggering: GitHub PR merge commits exist only on GitHub, and a
  # trigger for a commit absent from GitForge's repository storage mints a
  # run that fails at checkout (observed live 2026-10-11, run 38106742159).
  GITFORGE_GIT_URL: ${{ vars.GITFORGE_GIT_URL || '' }}
  GITFORGE_POLL_TIMEOUT_SECONDS: ${{ vars.GITFORGE_POLL_TIMEOUT_SECONDS || '1800' }}
  GITFORGE_POLL_INTERVAL_SECONDS: ${{ vars.GITFORGE_POLL_INTERVAL_SECONDS || '15' }}
  # How long the poll job waits for a queued trigger to be correlated to its
  # pipeline run. The scheduler answers POST /pipelines/trigger with
  # `status: "queued"` and a null pipeline_run_id once the trigger request is
  # durable but the asynchronous consumer has not created the run yet (its
  # in-request correlation window is 15s; under load it elapses). A queued
  # response is a pending request, not a failed enqueue.
  GITFORGE_CORRELATE_TIMEOUT_SECONDS: ${{ vars.GITFORGE_CORRELATE_TIMEOUT_SECONDS || '300' }}

permissions:
  contents: read

# Route ALL builds through GitForge instead of running directly on GitHub Actions runners.
# This prevents build storms and zombie processes by using GitForge's build queue.

jobs:
  # Enqueue build job to GitForge queue instead of running directly
  enqueue-build:
    name: Enqueue Build to GitForge
    if: vars.GITFORGE_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, gitforge-github]
    outputs:
      run_id: ${{ steps.enqueue.outputs.run_id }}
      trigger_id: ${{ steps.enqueue.outputs.trigger_id }}
      build_status: ${{ steps.enqueue.outputs.status }}
    steps:
      - name: Validate GitForge configuration
        env:
          GITFORGE_CI_TRIGGER_TOKEN: ${{ secrets.GITFORGE_CI_TRIGGER_TOKEN }}
          GITFORGE_SCHEDULER_OPERATOR_TOKEN: ${{ secrets.GITFORGE_SCHEDULER_OPERATOR_TOKEN }}
          GITFORGE_GIT_USERNAME: ${{ secrets.GITFORGE_GIT_USERNAME }}
          GITFORGE_GIT_TOKEN: ${{ secrets.GITFORGE_GIT_TOKEN }}
        run: |
          set -euo pipefail
          : "${GITFORGE_SCHEDULER_URL:?GITFORGE_SCHEDULER_URL is required}"
          : "${GITFORGE_REPO_ID:?GITFORGE_REPO_ID is required (GitForge UUID, not GitHub repository_id)}"
          : "${GITFORGE_GIT_URL:?GITFORGE_GIT_URL is required (git HTTP URL of the same repository)}"
          : "${GITFORGE_GIT_USERNAME:?GITFORGE_GIT_USERNAME is required (git push credential)}"
          : "${GITFORGE_GIT_TOKEN:?GITFORGE_GIT_TOKEN is required (git push credential)}"
          : "${GITFORGE_CI_TRIGGER_TOKEN:?GITFORGE_CI_TRIGGER_TOKEN is required (POST /pipelines/trigger)}"
          : "${GITFORGE_SCHEDULER_OPERATOR_TOKEN:?GITFORGE_SCHEDULER_OPERATOR_TOKEN is required (GET /pipelines/runs/{id})}"
          # Least privilege requires two distinct credentials; sharing one
          # value across both roles silently re-creates the old super-token.
          # This comparison never prints either value.
          if [ "$GITFORGE_CI_TRIGGER_TOKEN" = "$GITFORGE_SCHEDULER_OPERATOR_TOKEN" ]; then
            echo "GITFORGE_CI_TRIGGER_TOKEN and GITFORGE_SCHEDULER_OPERATOR_TOKEN must be distinct credentials" >&2
            exit 1
          fi
          # The git push credential grants repository writes; sharing it
          # with either scheduler role would recreate a cross-plane
          # super-token.
          if [ "$GITFORGE_GIT_TOKEN" = "$GITFORGE_CI_TRIGGER_TOKEN" ] || [ "$GITFORGE_GIT_TOKEN" = "$GITFORGE_SCHEDULER_OPERATOR_TOKEN" ]; then
            echo "GITFORGE_GIT_TOKEN must be distinct from the scheduler credentials" >&2
            exit 1
          fi
          [[ "$GITFORGE_REPO_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "GITFORGE_REPO_ID must be a UUID" >&2
            exit 1
          }
          case "$GITFORGE_GIT_URL" in
            http://*|https://*) ;;
            *) echo "GITFORGE_GIT_URL must be an http(s) git URL" >&2; exit 1 ;;
          esac
          [[ "$GITFORGE_POLL_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "GITFORGE_POLL_TIMEOUT_SECONDS must be a positive integer" >&2
            exit 1
          }
          [[ "$GITFORGE_POLL_INTERVAL_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "GITFORGE_POLL_INTERVAL_SECONDS must be a positive integer" >&2
            exit 1
          }
          [[ "$GITFORGE_CORRELATE_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "GITFORGE_CORRELATE_TIMEOUT_SECONDS must be a positive integer" >&2
            exit 1
          }
      # GitHub PR merge commits (`refs/pull/N/merge`) exist only on GitHub.
      # The GitForge run reads the commit from the repository's registered
      # git storage — both the workspace clone/checkout and the
      # committed-config loader (`git cat-file <sha>:<config>`, which
      # silently falls back to the default pipeline when the object is
      # absent) read from there — so the event's commit must be IN that
      # storage before POST /pipelines/trigger. Delivery uses the same
      # receive-pack path every developer push uses, landing the commit
      # under a per-SHA scratch ref (refs/ci/github-bridge/<sha>); no
      # branch or tag ever moves. The ref update itself fires a native
      # trigger, which the trigger endpoint dedups onto the same
      # (repo_id, new_hash) tuple as this workflow's POST below — one
      # active run either way. Validation is deterministic end to end:
      # the fetched head must equal github.sha, and `git ls-remote` must
      # serve the scratch ref at exactly that SHA before the enqueue POST
      # is allowed. An unreachable repo fails here, before any run exists.
      - name: Register commit in GitForge storage
        env:
          GITFORGE_GIT_URL: ${{ vars.GITFORGE_GIT_URL }}
          GITFORGE_GIT_USERNAME: ${{ secrets.GITFORGE_GIT_USERNAME }}
          GITFORGE_GIT_TOKEN: ${{ secrets.GITFORGE_GIT_TOKEN }}
          # github.ref is refs/pull/N/merge on pull_request events and
          # refs/heads/<branch> (or refs/tags/<tag>) on push events — the
          # one ref GitHub serves this event's commit at, for every event
          # type this workflow accepts.
          GITFORGE_FETCH_REF: ${{ github.ref }}
          GITFORGE_NEW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # IDs and refs arrive through the environment; a ref name is
          # attacker-controlled data and must never become shell code.
          [[ "$GITFORGE_NEW_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "GITFORGE_NEW_SHA must be a full SHA-1, got: $GITFORGE_NEW_SHA" >&2
            exit 1
          }
          case "$GITFORGE_FETCH_REF" in
            refs/*) ;;
            *) echo "GITFORGE_FETCH_REF must be a fully qualified ref, got: $GITFORGE_FETCH_REF" >&2; exit 1 ;;
          esac
          BRIDGE_REF="refs/ci/github-bridge/$GITFORGE_NEW_SHA"
          SCRATCH="$(mktemp -d "$RUNNER_TEMP/github-bridge.XXXXXX")"
          trap 'rm -rf "$SCRATCH"' EXIT
          export GIT_TERMINAL_PROMPT=0
          git init --bare "$SCRATCH/bridge.git"
          git -C "$SCRATCH/bridge.git" remote add github "https://github.com/${GITHUB_REPOSITORY}.git"
          # Full history, never --depth: a shallow push would install a
          # shallow boundary in the instance's storage repo and break
          # later clones of it. Transport failures are transient and
          # retried; a ref GitHub does not serve is terminal (the sha
          # equality check below is the gate, not the fetch exit code).
          attempts=0
          until git -C "$SCRATCH/bridge.git" fetch --no-tags github "+$GITFORGE_FETCH_REF"; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 3 ]; then
              echo "GitHub fetch of $GITFORGE_FETCH_REF failed after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
          RAW_SHA=$(git -C "$SCRATCH/bridge.git" rev-parse --verify FETCH_HEAD) || {
            echo "fetch of $GITFORGE_FETCH_REF produced no readable head" >&2
            exit 1
          }
          COMMIT_SHA=$(git -C "$SCRATCH/bridge.git" rev-parse --verify "FETCH_HEAD^{commit}") || {
            echo "fetched $GITFORGE_FETCH_REF does not resolve to a commit" >&2
            exit 1
          }
          # github.sha names the commit for push events and the merge head
          # for pull_request events; annotated-tag pushes may deliver the
          # tag object itself, so either identity is accepted — the peel is
          # what the instance stores.
          if [ "$GITFORGE_NEW_SHA" != "$RAW_SHA" ] && [ "$GITFORGE_NEW_SHA" != "$COMMIT_SHA" ]; then
            echo "GitHub serves $GITFORGE_FETCH_REF at $RAW_SHA (commit $COMMIT_SHA), expected $GITFORGE_NEW_SHA; refusing to trigger a build of a commit GitHub does not serve at this ref" >&2
            exit 1
          fi
          git -C "$SCRATCH/bridge.git" update-ref refs/heads/github-bridge "$COMMIT_SHA"
          # Clear inherited helpers first: the runner host may hold stored
          # credentials for the GitForge host, and this step must present
          # exactly the workflow's push credential, read from the
          # environment inside the helper so it never appears in the
          # process list, remote URLs, or logs. The single quotes on
          # CRED_HELPER are the point: the helper's own shell expands the
          # variables from the environment when git invokes it, so the
          # secret never passes through this script's expansion.
          # shellcheck disable=SC2016
          CRED_HELPER='!f() { printf "username=%s\n" "$GITFORGE_GIT_USERNAME"; printf "password=%s\n" "$GITFORGE_GIT_TOKEN"; }; f'
          GITFORGE_CRED=(-c credential.helper= -c "credential.helper=$CRED_HELPER")
          git -C "$SCRATCH/bridge.git" "${GITFORGE_CRED[@]}" remote add gitforge "$GITFORGE_GIT_URL"
          if ! git -C "$SCRATCH/bridge.git" "${GITFORGE_CRED[@]}" push gitforge "refs/heads/github-bridge:$BRIDGE_REF" 2>&1; then
            echo "GitForge rejected the commit registration push ($BRIDGE_REF); refusing to enqueue a trigger for a commit absent from repository storage" >&2
            exit 1
          fi
          # Deterministic postcondition: the instance must now SERVE the
          # scratch ref at exactly the event's commit before anything is
          # enqueued against it.
          SERVED=$(git -C "$SCRATCH/bridge.git" "${GITFORGE_CRED[@]}" ls-remote gitforge "$BRIDGE_REF" | awk '{print $1}')
          if [ "$SERVED" != "$COMMIT_SHA" ]; then
            echo "GitForge does not serve $BRIDGE_REF at $COMMIT_SHA (got: ${SERVED:-nothing}); refusing to enqueue" >&2
            exit 1
          fi
          echo "GitForge storage now serves $BRIDGE_REF at $COMMIT_SHA"
      - name: Enqueue build job
        id: enqueue
        env:
          # GitHub context values are passed through the environment rather
          # than interpolated into this script's source text: a ref name is
          # attacker-controlled data and must never become shell code.
          GITFORGE_REF: ${{ github.ref_name }}
          GITFORGE_OLD_SHA: ${{ github.event.before }}
          GITFORGE_NEW_SHA: ${{ github.sha }}
          GITFORGE_CI_TRIGGER_TOKEN: ${{ secrets.GITFORGE_CI_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          # Trigger the GitForge CI service. The service durably records the
          # trigger request, then tries to correlate the created run within
          # its in-request window. A 202 with `pipeline_run_id` is a
          # correlated run; a 202 with only a `trigger_id` is a durable
          # queued request the poll job correlates. This step uses ONLY the
          # least-privilege CI trigger credential
          # (secrets.GITFORGE_CI_TRIGGER_TOKEN), which the scheduler rejects
          # on run-status reads; status is polled with the separate scheduler
          # operator credential (secrets.GITFORGE_SCHEDULER_OPERATOR_TOKEN).
          # The gateway route /api/pipeline-runs/{id} requires a user JWT,
          # which this workflow deliberately never holds.
          PAYLOAD=$(jq -n \
            --arg repo "$GITFORGE_REPO_ID" \
            --arg ref "$GITFORGE_REF" \
            --arg old "$GITFORGE_OLD_SHA" \
            --arg new "$GITFORGE_NEW_SHA" \
            '{repo_id:$repo,ref_name:$ref,old_hash:$old,new_hash:$new,working_dir:null}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$GITFORGE_SCHEDULER_URL/pipelines/trigger" \
            -H "Authorization: Bearer $GITFORGE_CI_TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            RUN_ID=$(echo "$BODY" | jq -r '.pipeline_run_id // empty')
            TRIGGER_ID=$(echo "$BODY" | jq -r '.trigger_id // empty')
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              [[ "$RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || {
                echo "GitForge returned an invalid pipeline_run_id: $RUN_ID" >&2
                exit 1
              }
              {
                echo "run_id=$RUN_ID"
                echo "trigger_id=$TRIGGER_ID"
                echo "status=enqueued"
              } >> "$GITHUB_OUTPUT"
              echo "Successfully enqueued pipeline run $RUN_ID"
              exit 0
            fi
            if [ -n "$TRIGGER_ID" ] && [ "$TRIGGER_ID" != "null" ]; then
              [[ "$TRIGGER_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || {
                echo "GitForge returned an invalid trigger_id: $TRIGGER_ID" >&2
                exit 1
              }
              {
                echo "run_id="
                echo "trigger_id=$TRIGGER_ID"
                echo "status=enqueued"
              } >> "$GITHUB_OUTPUT"
              echo "GitForge accepted trigger $TRIGGER_ID; run correlation pending"
              exit 0
            fi
            echo "GitForge accepted nothing durable (no pipeline_run_id, no trigger_id); refusing to bypass GitForge" >&2
            exit 1
          fi

          echo "GitForge enqueue failed (HTTP $HTTP_CODE); refusing to bypass GitForge" >&2
          exit 1

  # Poll GitForge for build status (when GitForge is available)
  poll-build:
    name: Poll GitForge Build Status
    needs: enqueue-build
    if: needs.enqueue-build.outputs.build_status == 'enqueued'
    runs-on: [self-hosted, linux, x64, gitforge-github]
    outputs:
      terminal_status: ${{ steps.poll.outputs.terminal_status }}
    steps:
      - name: Poll for build completion
        id: poll
        env:
          # IDs arrive through the environment; never interpolate API output
          # directly into this script's source text.
          RUN_ID: ${{ needs.enqueue-build.outputs.run_id }}
          TRIGGER_ID: ${{ needs.enqueue-build.outputs.trigger_id }}
          GITFORGE_REF: ${{ github.ref_name }}
          GITFORGE_OLD_SHA: ${{ github.event.before }}
          GITFORGE_NEW_SHA: ${{ github.sha }}
          GITFORGE_CI_TRIGGER_TOKEN: ${{ secrets.GITFORGE_CI_TRIGGER_TOKEN }}
          GITFORGE_SCHEDULER_OPERATOR_TOKEN: ${{ secrets.GITFORGE_SCHEDULER_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$RUN_ID" ] && ! [[ "$RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "run_id output must be a UUID" >&2
            exit 1
          fi
          if [ -z "$RUN_ID" ]; then
            : "${TRIGGER_ID:?trigger_id output is required when no run ID is returned}"
            [[ "$TRIGGER_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || {
              echo "trigger_id output must be a UUID" >&2
              exit 1
            }
          fi

          # A queued trigger carries only its durable request ID. Correlate
          # it to its run by re-POSTing the byte-identical trigger tuple.
          # The scheduler dedups ACTIVE (pending/processing) trigger
          # requests on (repo_id, new_hash): while the original request is
          # in flight the response echoes the SAME trigger_id and never
          # mints a second run. Once the original settles it is invisible
          # to dedup, and the endpoint reports a terminal trigger failure
          # and a post-window completion identically (`queued`, null run
          # id) — so a response echoing a DIFFERENT trigger_id means the
          # original can no longer be identified. If that fresh response
          # carries no run id, retrying cannot recover the original and
          # only mints more doomed requests: fail immediately. If it does
          # carry a run id, that run built the identical commit tuple; log
          # the substitution and poll it. The trigger-status endpoint on
          # codex/pr280-trigger-status-20261008 removes this blind spot
          # once deployed.
          if [ -z "$RUN_ID" ]; then
            PAYLOAD=$(jq -n \
              --arg repo "$GITFORGE_REPO_ID" \
              --arg ref "$GITFORGE_REF" \
              --arg old "$GITFORGE_OLD_SHA" \
              --arg new "$GITFORGE_NEW_SHA" \
              '{repo_id:$repo,ref_name:$ref,old_hash:$old,new_hash:$new,working_dir:null}')
            deadline=$(( $(date +%s) + GITFORGE_CORRELATE_TIMEOUT_SECONDS ))
            echo "Trigger $TRIGGER_ID queued; correlating to its pipeline run..."
            while [ -z "$RUN_ID" ]; do
              RESPONSE=""
              HTTP_CODE="000"
              BODY=""
              # Re-POSTs carry the SAME trigger credential as the original
              # enqueue so the scheduler's dedup echo contract applies.
              if RESPONSE=$(curl --silent --show-error --max-time 30 \
                --write-out "\n%{http_code}" \
                -X POST \
                -H "Authorization: Bearer $GITFORGE_CI_TRIGGER_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$GITFORGE_SCHEDULER_URL/pipelines/trigger"); then
                HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
                BODY=$(printf '%s' "$RESPONSE" | sed '$d')
              fi

              case "$HTTP_CODE" in
                200|201|202)
                  CANDIDATE=$(printf '%s' "$BODY" | jq -r '.pipeline_run_id // empty')
                  if [ -n "$CANDIDATE" ]; then
                    [[ "$CANDIDATE" =~ ^[0-9a-fA-F-]{36}$ ]] || {
                      echo "GitForge correlation returned an invalid pipeline_run_id: $CANDIDATE" >&2
                      exit 1
                    }
                    RUN_ID="$CANDIDATE"
                    echo "Trigger $TRIGGER_ID correlated to pipeline run $RUN_ID"
                    break
                  fi
                  ECHOED=$(printf '%s' "$BODY" | jq -r '.trigger_id // empty')
                  if [ -n "$ECHOED" ] && [ "$ECHOED" != "$TRIGGER_ID" ]; then
                    echo "GitForge settled trigger $TRIGGER_ID without a run id (terminal trigger failure, or completed after the correlation window); its run cannot be identified through this contract and re-POSTing only mints more doomed requests" >&2
                    echo "terminal_status=trigger_lost" >> "$GITHUB_OUTPUT"
                    exit 1
                  fi
                  ;;
                000|408|429|5??)
                  # Transport loss, rate limiting, and server errors are
                  # transient; the durable request outlives them.
                  ;;
                *)
                  echo "GitForge trigger correlation returned non-retryable HTTP $HTTP_CODE: $BODY" >&2
                  exit 1
                  ;;
              esac

              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "GitForge trigger did not produce a run within ${GITFORGE_CORRELATE_TIMEOUT_SECONDS}s" >&2
                echo "terminal_status=timeout" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              sleep "$GITFORGE_POLL_INTERVAL_SECONDS"
            done
          fi

          # Pipeline runs are served by the scheduler control plane
          # (GET /pipelines/runs/{id}) under the scheduler operator
          # credential ONLY — the scheduler rejects the trigger credential
          # on this route (401).
          STATUS_URL="$GITFORGE_SCHEDULER_URL/pipelines/runs/$RUN_ID"
          echo "Build enqueued, polling GitForge scheduler for status..."

          deadline=$(( $(date +%s) + GITFORGE_POLL_TIMEOUT_SECONDS ))
          while :; do
            RESPONSE=""
            HTTP_CODE="000"
            BODY=""
            # Transport and 5xx failures are transient: keep polling until the
            # deadline instead of failing the check on the first bad response.
            if RESPONSE=$(curl --silent --show-error --max-time 30 \
              --write-out "\n%{http_code}" \
              -H "Authorization: Bearer $GITFORGE_SCHEDULER_OPERATOR_TOKEN" \
              -H "Accept: application/json" \
              "$STATUS_URL"); then
              HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
              BODY=$(printf '%s' "$RESPONSE" | sed '$d')
            fi

            STATUS=""
            if [ "$HTTP_CODE" = "200" ]; then
              STATUS=$(printf '%s' "$BODY" | jq -r '.status // empty' 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
            fi
            echo "GitForge pipeline run $RUN_ID status: ${STATUS:-unknown} (HTTP $HTTP_CODE)"

            # Retry transport loss, rate limiting, and server errors only.
            # Authentication, authorization, malformed IDs, and redirects are
            # configuration/protocol failures; polling them for 30 minutes
            # cannot recover and hides the actionable cause.
            case "$HTTP_CODE" in
              200|000|408|429|5??) ;;
              [1-9][0-9][0-9])
                echo "GitForge status endpoint returned non-retryable HTTP $HTTP_CODE" >&2
                exit 1
                ;;
              *)
                echo "GitForge status endpoint returned invalid HTTP code: $HTTP_CODE" >&2
                exit 1
                ;;
            esac

            case "$STATUS" in
              completed|succeeded|success|passed)
                echo "terminal_status=$STATUS" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              failed|failure|cancelled|canceled|timed_out|timeout|error)
                CAUSE=$(printf '%s' "$BODY" | jq -r '.error // empty' 2>/dev/null | head -c 400 || true)
                if [ -n "$CAUSE" ]; then
                  echo "GitForge failure cause: $CAUSE" >&2
                fi
                echo "GitForge job reached unsuccessful terminal state: $STATUS" >&2
                echo "terminal_status=$STATUS" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
              *)
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "GitForge pipeline run did not reach a terminal state within ${GITFORGE_POLL_TIMEOUT_SECONDS}s" >&2
                  echo "terminal_status=timeout" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
                sleep "$GITFORGE_POLL_INTERVAL_SECONDS"
                ;;
            esac
          done

  # Report final status to GitHub
  report-status:
    name: Report Build Status
    needs: [enqueue-build, poll-build]
    if: always() && vars.GITFORGE_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, gitforge-github]
    steps:
      - name: Report completion
        run: |
          echo "GitForge enqueue status: ${{ needs.enqueue-build.outputs.build_status }}"
          echo "GitForge poll job result: ${{ needs.poll-build.result }}"
          echo "GitForge terminal status: ${{ needs.poll-build.outputs.terminal_status || 'not-reached' }}"
          if [ "${{ needs.poll-build.result }}" != "success" ]; then
            echo "GitForge CI did not complete successfully" >&2
            exit 1
          fi
