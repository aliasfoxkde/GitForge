name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  try-merge:
    # Only act on PRs from the same owner (no forks auto-merging)
    if: github.event.pull_request.user.login == github.event.repository.owner.login
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CI status
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # gh evaluates all check runs and legacy status contexts. Do not
          # infer readiness from a check-run field (`type`) that is not present
          # in the API payload.
          if ! gh pr checks "$PR_NUMBER"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Checks are pending or failing; auto-merge remains disabled."
            exit 0
          fi

          MERGE_STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')
          case "$MERGE_STATE" in
            CLEAN|BLOCKED)
              echo "Required checks pass; merge state is $MERGE_STATE."
              ;;
            *)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Merge state $MERGE_STATE is not safe for auto-merge." >&2
              exit 0
              ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}

          # Enable auto-merge
          gh pr merge $PR_NUMBER --squash --delete-branch --auto || {
            echo "Auto-merge failed (可能是因为分支保护或冲突)"
            exit 1
          }
          echo "Auto-merge enabled successfully!"
