name: Build

on:
  workflow_call:
    inputs:
      has_go:
        required: true
        type: string
      has_python:
        required: true
        type: string
      has_rust:
        required: true
        type: string
      has_typescript:
        required: true
        type: string
      has_bash:
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false

jobs:
  # ─── Go Build ───────────────────────────────────────────────────────────
  build-go:
    name: Build Go
    if: inputs.has_go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build -o bin/atheon ./cmd/atheon && go build -o bin/atheon-mcp ./cmd/mcp

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-go-${{ matrix.os }}
          path: bin/

  # ─── Python Build ───────────────────────────────────────────────────────
  build-python:
    name: Build Python
    runs-on: ubuntu-latest
    if: inputs.has_python == 'true'
    env:
      UV_VERSION: ${{ vars.UV_VERSION || '0.5.18' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Build wheel
        run: uv build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/

  # ─── Rust Build ─────────────────────────────────────────────────────────
  build-rust:
    name: Build Rust
    runs-on: ubuntu-latest
    if: inputs.has_rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --workspace --release --all-features --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-rust-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/

  # ─── TypeScript Build ───────────────────────────────────────────────────
  build-ts:
    name: Build TypeScript
    runs-on: ubuntu-latest
    if: inputs.has_typescript == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-ts
          path: dist/
