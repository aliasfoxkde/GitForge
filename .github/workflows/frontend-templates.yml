name: Frontend Templates

on:
  push:
    branches: [main, stable]
    paths:
      - 'template-parts/vite-react-pwa/**'
      - 'template-parts/vite-ssr/**'
      - '.github/workflows/frontend-templates.yml'
  pull_request:
    paths:
      - 'template-parts/vite-react-pwa/**'
      - 'template-parts/vite-ssr/**'
      - '.github/workflows/frontend-templates.yml'

concurrency:
  group: frontend-templates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template:
          - template-parts/vite-react-pwa
          - template-parts/vite-ssr
    defaults:
      run:
        working-directory: ${{ matrix.template }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.template }}/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Unit and integration tests
        run: pnpm exec vitest run

      - name: Browser E2E tests
        run: pnpm run test:e2e
