name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"  # Weekly scan

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["go", "rust"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Exclude test files and template scaffolding from analysis
          config: |
            paths-ignore:
              - '**/*_test.go'
              - '**/*_test.rs'
              - 'template-parts/**'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        if: matrix.language == 'go'
        with:
          go: current

      - name: Build Rust
        if: matrix.language == 'rust'
        run: |
          cargo fetch --locked
          cargo build --workspace --release || cargo build --workspace || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
