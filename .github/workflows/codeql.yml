name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"  # Weekly scan

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Rust query evaluation can exceed the default job budget on this
    # multi-crate workspace; keep the guard bounded but allow completion.
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["go", "rust"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Exclude test files and template scaffolding from analysis
          config: |
            paths-ignore:
              - '**/*_test.go'
              - '**/*_test.rs'
              - 'template-parts/**'

      - name: Autobuild
        uses: github/codeql-action/autobuild@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        if: matrix.language == 'go'

      - name: Build Rust
        if: matrix.language == 'rust'
        run: |
          cargo fetch --locked
          # CodeQL needs a complete instrumentable build, not release
          # optimizations. Debug mode keeps analysis bounded and avoids
          # duplicating the release-build gate in Rust CI.
          cargo build --workspace --locked

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
        with:
          category: "/language:${{matrix.language}}"
