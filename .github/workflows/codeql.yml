name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"  # Weekly scan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, linux, x64, gitforge]
    # Rust query evaluation can exceed the default job budget on this
    # multi-crate workspace; keep the guard bounded but allow completion.
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      # Match the dedicated runner's 12 GiB memory cap and avoid CodeQL's
      # host-sized defaults exhausting the runner during database finalization.
      CODEQL_THREADS: 2
      CODEQL_RAM: 8192
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Keep the language set aligned with the default branch so GitHub can
        # compute pull-request alert deltas. Go sources are scaffolding and
        # remain excluded by the CodeQL paths-ignore configuration, but the
        # category must still be analyzed for baseline compatibility.
        language: ["go", "rust"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Exclude test files and template scaffolding from analysis
          config: |
            paths-ignore:
              - '**/*_test.go'
              - '**/*_test.rs'
              - 'template-parts/**'

      - name: Build Rust
        if: matrix.language == 'rust'
        run: |
          cargo fetch --locked
          # CodeQL needs a complete instrumentable build, not release
          # optimizations. Debug mode keeps analysis bounded and avoids
          # duplicating the release-build gate in Rust CI.
          cargo build --workspace --locked

      - name: Build Go
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{matrix.language}}"
