name: CI

# ─── Triggers ────────────────────────────────────────────────────────────────
# NO path filtering — this is a template repo; must run on ALL file changes.
# Language-specific jobs use needs.detect-languages.outputs.has_<lang> to skip.
on:
  push:
    branches: [$default-branch]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_BRANCH: ${{ vars.DEFAULT_BRANCH || 'main' }}
  COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || 70 }}
  GOLANGCI_LINT_VERSION: ${{ vars.GOLANGCI_LINT_VERSION || 'v2.1.6' }}

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:
  # ─── Always-pass check ──────────────────────────────────────────────────
  # Satisfies branch protection even for empty repos or repos with no code.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: CI check
        run: echo "CI check passed — repository validated"

  # ─── Language Detection ───────────────────────────────────────────────────
  detect-languages:
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.detect.outputs.has_go }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_typescript: ${{ steps.detect.outputs.has_typescript }}
      has_bash: ${{ steps.detect.outputs.has_bash }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: ${{ github.action_path }}/../actions/detect-languages/detect.sh

  # ─── Lint ────────────────────────────────────────────────────────────────
  lint:
    needs: [check, detect-languages]
    uses: ./.github/workflows/lint.yml
    with:
      has_go: ${{ needs.detect-languages.outputs.has_go }}
      has_python: ${{ needs.detect-languages.outputs.has_python }}
      has_rust: ${{ needs.detect-languages.outputs.has_rust }}
      has_typescript: ${{ needs.detect-languages.outputs.has_typescript }}
      has_bash: ${{ needs.detect-languages.outputs.has_bash }}
    secrets: inherit

  # ─── Test ─────────────────────────────────────────────────────────────────
  test:
    needs: [check, detect-languages]
    uses: ./.github/workflows/test.yml
    with:
      has_go: ${{ needs.detect-languages.outputs.has_go }}
      has_python: ${{ needs.detect-languages.outputs.has_python }}
      has_rust: ${{ needs.detect-languages.outputs.has_rust }}
      has_typescript: ${{ needs.detect-languages.outputs.has_typescript }}
      has_bash: ${{ needs.detect-languages.outputs.has_bash }}
    secrets: inherit

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    needs: [check, detect-languages]
    uses: ./.github/workflows/build.yml
    with:
      has_go: ${{ needs.detect-languages.outputs.has_go }}
      has_python: ${{ needs.detect-languages.outputs.has_python }}
      has_rust: ${{ needs.detect-languages.outputs.has_rust }}
      has_typescript: ${{ needs.detect-languages.outputs.has_typescript }}
      has_bash: ${{ needs.detect-languages.outputs.has_bash }}
    secrets: inherit

  # ─── Security ─────────────────────────────────────────────────────────────
  security:
    needs: [check, detect-languages]
    uses: ./.github/workflows/security.yml
    with:
      has_go: ${{ needs.detect-languages.outputs.has_go }}
      has_python: ${{ needs.detect-languages.outputs.has_python }}
      has_rust: ${{ needs.detect-languages.outputs.has_rust }}
      has_typescript: ${{ needs.detect-languages.outputs.has_typescript }}
    secrets: inherit

  # ─── Smoke Tests ──────────────────────────────────────────────────────────
  smoke-test:
    needs: [check]
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit

  # ─── Quality Audit ───────────────────────────────────────────────────────
  quality-audit:
    needs: [check, detect-languages]
    uses: ./.github/workflows/quality-audit.yml
    with:
      has_go: ${{ needs.detect-languages.outputs.has_go }}
      has_python: ${{ needs.detect-languages.outputs.has_python }}
      has_rust: ${{ needs.detect-languages.outputs.has_rust }}
      has_typescript: ${{ needs.detect-languages.outputs.has_typescript }}
    secrets: inherit
