name: AI Code Review

on:
  pull_request:
    paths:
      - '**.rs'
      - '**.go'
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.java'
      - '!**/test/**'
      - '!**/*_test.rs'
      - '!**/tests/**'
  workflow_dispatch:
    inputs:
      provider:
        description: 'AI Provider'
        required: false
        default: 'anthropic'
        type: choice
        options:
          - anthropic
          - openai
          - ollama

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Get PR diff
        id: pr-diff
        run: |
          # Get the diff between the PR branch and main
          BASE_BRANCH=${{ github.base_ref || 'main' }}
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT

          # The checkout is on the PR head; fetch the base ref explicitly
          # instead of assuming a local branch named after the base exists.
          git fetch --no-tags origin "$BASE_BRANCH"

          # Generate diff
          git diff "origin/$BASE_BRANCH"...HEAD > pr.diff
          echo "diff_file=pr.diff" >> $GITHUB_OUTPUT

          # Count files changed
          FILES_CHANGED=$(git diff --name-only "origin/$BASE_BRANCH"...HEAD | wc -l)
          echo "files_changed=$FILES_CHANGED" >> $GITHUB_OUTPUT

      - name: Run AI Review
        id: review
        env:
          PROVIDER: ${{ github.event.inputs.provider || 'anthropic' }}
        run: |
          # Build the CLI first
          cargo build --package gitforge-cli --release --locked

          REVIEW_CMD="./target/release/gitforge review --diff --provider $PROVIDER --verbose"

          # Run the review and capture output
          set +e
          OUTPUT=$($REVIEW_CMD 2>&1)
          REVIEW_STATUS=$?
          set -e
          echo "$OUTPUT"

          # Extract summary for GitHub comment
          SUMMARY=$(echo "$OUTPUT" | grep -A 20 "CODE REVIEW RESULTS" | head -30 || echo "Review completed")
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

          # Check for critical findings
          if echo "$OUTPUT" | grep -q "Critical"; then
            echo "critical_findings=true" >> $GITHUB_OUTPUT
          else
            echo "critical_findings=false" >> $GITHUB_OUTPUT
          fi

          echo "review_status=$REVIEW_STATUS" >> $GITHUB_OUTPUT

      - name: Post review comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const summary = `${{ steps.review.outputs.summary || 'Review completed' }}`;
            const hasCritical = `${{ steps.review.outputs.critical_findings }}` === 'true';

            const body = `
            ## 🤖 AI Code Review Results

            ${summary.replace(/"/g, '\\"')}

            ${hasCritical ? '⚠️ **Warning**: Critical security issues detected!' : '✅ No critical issues found.'}

            _AI Code Review powered by GitForge_
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail when review execution fails
        if: steps.review.outputs.review_status != '0'
        run: |
          echo "AI review command failed with status ${{ steps.review.outputs.review_status }}"
          exit 1

      - name: Fail on critical issues
        if: steps.review.outputs.critical_findings == 'true'
        run: |
          echo "Critical security issues detected in code review"
          exit 1

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Run security scan
        run: |
          # Run cargo-audit or similar security checks
          cargo install cargo-audit --locked --quiet
          cargo audit

  # Run standard tests alongside AI review
  test-checks:
    name: Test Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
