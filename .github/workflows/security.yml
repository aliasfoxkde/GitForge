name: Security

on:
  workflow_call:
    inputs:
      has_go:
        required: true
        type: string
      has_python:
        required: true
        type: string
      has_rust:
        required: true
        type: string
      has_typescript:
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Secrets Scan (always runs) ──────────────────────────────────────────
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed secrets
        run: |
          echo "Checking for leaked secrets in commits..."
          # Exclude issue templates (contain example patterns, not real secrets)
          FOUND=$(find . \
            \( -path './.github/ISSUE_TEMPLATE' -o -path './.git' \
               -o -path './template-parts/atheon-enhanced' \) -prune -o \
            \( -name '*.go' -o -name '*.py' -o -name '*.rs' \
               -o -name '*.ts' -o -name '*.js' -o -name '*.yaml' \
               -o -name '*.yml' -o -name '*.sh' -o -name '*.json' \
               -o -name '*.md' \) \
            -type f -exec grep -lE "ghp_[0-9a-zA-Z]{36}|gho_[0-9a-zA-Z]{36}|AKIA[0-9A-Z]{16}" {} \; 2>/dev/null)
          if [ -n "$FOUND" ]; then
            echo "WARNING: Potential secrets found in repository:"
            echo "$FOUND"
            exit 1
          fi
          echo "No obvious secrets detected."

  # ─── Dependency Review (always runs) ────────────────────────────────────
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for vulnerable dependencies
        uses: actions/dependency-review-action@v4
        continue-on-error: true

  # ─── Atheon Security Scan ────────────────────────────────────────────────
  atheon-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Atheon-Enhanced
        run: |
          wget -q https://github.com/aliasfoxkde/Atheon-Enhanced/releases/latest/download/atheon-linux-amd64
          chmod +x atheon-linux-amd64
          sudo mv atheon-linux-amd64 /usr/local/bin/atheon

      - name: Run Atheon Security Scan (secrets + PII + security)
        run: |
          atheon --categories=secrets,pii,security --sarif results.sarif ./

      - name: Run Atheon Quality Scan
        run: |
          atheon --categories=ai-detection,quality --sarif quality-results.sarif ./ || true

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: atheon-security

      - name: Upload Quality SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: quality-results.sarif
          category: atheon-quality

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: atheon-results
          path: |
            results.sarif
            quality-results.sarif

  # ─── CodeQL (per language) ────────────────────────────────────────────────
  codeql-go:
    name: CodeQL Go
    runs-on: ubuntu-latest
    if: inputs.has_go == 'true'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"

  codeql-rust:
    name: CodeQL Rust
    runs-on: ubuntu-latest
    if: inputs.has_rust == 'true'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: security-extended

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"

  codeql-typescript:
    name: CodeQL TypeScript
    runs-on: ubuntu-latest
    if: inputs.has_typescript == 'true'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ─── Vulnerability Scans (per language) ──────────────────────────────────
  vuln-go:
    name: Vulnerability Scan Go
    runs-on: ubuntu-latest
    if: inputs.has_go == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  vuln-python:
    name: Vulnerability Scan Python
    runs-on: ubuntu-latest
    if: inputs.has_python == 'true'
    env:
      UV_VERSION: ${{ vars.UV_VERSION || '0.5.18' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Audit dependencies
        run: uv pip audit || true

  vuln-rust:
    name: Vulnerability Scan Rust
    runs-on: ubuntu-latest
    if: inputs.has_rust == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  vuln-ts:
    name: Vulnerability Scan TypeScript
    runs-on: ubuntu-latest
    if: inputs.has_typescript == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate || true
