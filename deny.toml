# Repository dependency policy. Keep this intentionally explicit: a new
# license, source, duplicate-version explosion, or advisory must be reviewed
# rather than silently accepted by CI.

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"

[bans]
multiple-versions = "warn"
# Workspace path dependencies are intentionally local and cargo-deny treats
# them as wildcard dependencies for crates.io publication purposes. Keep this
# visible as a warning; registry/git wildcard requirements remain reviewable.
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
