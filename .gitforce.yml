# GitForge local CI pipeline (self-hosted GitForge at /nas/Temp/repos/GitForge).
#
# The project's own gates, run by the project itself: rustfmt --check, the
# strict clippy pass, and the workspace test suite. Pushes to any branch run
# the full chain, so a PR branch is validated here before it merges.
#
# Documented constraints (same list proven in gods-eye-view's and dsc's
# .gitforce.yml):
# - The job graph is a LINEAR CHAIN (fmt → clippy → test), not a fan-out,
#   because all jobs of one run share the SAME workspace directory on this
#   runner. Concurrent jobs would run cargo against the same target/
#   directory and corrupt each other's build locks.
# - `environment: {}` is required by the parser (PipelineDefinition has no
#   serde default) even though it is never forwarded.
# - The image is pre-built on the host (dsc-ci-rust:7 — cargo, clippy,
#   rustfmt, llvm-tools + cargo-llvm-cov for the coverage gate, and the
#   GitForge workspace cargo registry cache baked in for offline builds).
#   Rebuild and bump the tag whenever Cargo.lock changes or the baked
#   tooling changes — a stale cache fails every cargo job in seconds with
#   "candidate versions found which didn't match" (v7 adds the coverage
#   toolchain; v6 existed because v5 dropped openssh-client, which the
#   hermetic ssh-protocol tests spawn via ssh-keygen; v5 itself existed
#   because the audited-deps bump moved jsonwebtoken to 11.1.0 ahead of
#   v4's cache). The recipe lives at
#   infrastructure/docker/ci-rust.Dockerfile. The image must exist before
#   the first run: the NAS daemon's vfs storage driver plus the runner's
#   hard 60-second sandbox-acquisition cap make a pull-at-run-time a
#   guaranteed failure.
# - Cargo state is cold in the container (no cache mount), so clippy and
#   test each pay a full dependency compile; the generous timeouts absorb
#   that rather than gating on a cache setup this repo doesn't own.
name: gitforge-ci
version: "1.0"
trigger_on:
  - push
environment: {}
jobs:
  - name: fmt
    image: dsc-ci-rust:7
    steps:
      - name: Check formatting
        run: cargo fmt --all -- --check
    timeout: 15m

  - name: clippy
    image: dsc-ci-rust:7
    needs: [fmt]
    steps:
      - name: Strict lint (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
    timeout: 60m

  - name: test
    image: dsc-ci-rust:7
    needs: [clippy]
    steps:
      - name: Workspace test suite
        # Bounded test parallelism: with the daemon's vfs storage driver the
        # in-container fork/exec of the real `git` children spawned by the
        # gitforge-core http tests is slow enough that at default parallelism
        # (= host core count) the parent's request write races the child's
        # readiness and fails with EPIPE — 3 of 4 runs lost that race while
        # the same suite passed on the host. Two threads keeps the suite
        # well inside the 60m timeout and makes the gate deterministic.
        run: cargo test --workspace -- --test-threads=2
    timeout: 60m

  - name: coverage
    image: dsc-ci-rust:7
    needs: [test]
    steps:
      - name: Line coverage gate (fail 82, warn 84)
        # Thresholds are calibrated AGAINST THE SANDBOX the job runs in:
        # two identical in-sandbox sweeps of the campaign branch measured
        # 82.80% (bridge network) and 82.82% (--network none) — stable to
        # within noise. The original 87% came from a HOST sweep and was a
        # calibration mistake: on the host, ambient services (a live
        # GitForge API on localhost, the docker socket, host git config)
        # let integration tests exercise real paths and inflate the
        # number by ~4.8pp. A gate must be measured where it runs.
        # Hard gate 82 (0.8pp below the measured floor), advisory target
        # 84 to grow into. llvm-cov re-runs the test suite instrumented,
        # so it inherits the bounded test parallelism the test job
        # documents. Steps run under sh (dash): no pipefail, and a `tee`
        # pipeline would hide the gate's exit code, so the run is
        # captured through an if-redirect and printed afterwards.
        #
        # The runner caps the captured step log at 64 KB (older bytes are
        # dropped first), and llvm-cov's compile+test chatter alone
        # exceeds that — printing the full summary would truncate away
        # the gate verdict exactly when someone needs it. Print only the
        # verdict lines; on failure also print the tail of the capture
        # (the failing test block) so the evidence survives the cap.
        run: |
          summary=$(mktemp)
          if cargo llvm-cov --workspace --all-targets --summary-only \
               --fail-under-lines 82 -- --test-threads=2 >"$summary" 2>&1
          then gate=ok
          else gate=fail
          fi
          pct=$(awk '$1=="TOTAL" {gsub(/%/,"",$10); print $10; exit}' "$summary")
          if [ -n "$pct" ]; then
            echo "line coverage: ${pct}%"
          else
            echo "FAIL: coverage summary unparsable (no TOTAL row); capture tail follows"
            tail -40 "$summary"
            exit 1
          fi
          if [ "$gate" = fail ]; then
            echo "FAIL: line coverage ${pct}% is below the 82% hard gate; capture tail follows"
            tail -40 "$summary"
            exit 1
          fi
          if awk "BEGIN{exit !($pct < 84.0)}"; then
            echo "WARN: line coverage ${pct}% is below the 84% advisory target"
          else
            echo "line coverage ${pct}% meets the 84% target"
          fi
    timeout: 90m
