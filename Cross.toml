# Cross.toml - Cross-compilation configuration for GitForge
# See: https://github.com/cross-rs/cross
#
# macOS cross-compilation options:
# 1. Use GitHub Actions macOS runners (recommended for releases)
# 2. Use Zig with cargo-zigbuild (fast, works from Linux)
# 3. Use osxcross (requires manual Apple SDK setup)
# 4. Build on macOS hardware directly

[target.x86_64-unknown-linux-musl]
image = "x86_64-unknown-linux-musl:cross"

[target.aarch64-unknown-linux-musl]
image = "aarch64-unknown-linux-musl:cross"

# macOS targets using osxcross-based image
# Requires Apple SDK which must be obtained legally from Apple
[target.x86_64-apple-darwin]
image = "ghcr.io/messense/cross:arm64-linux-android"

[target.aarch64-apple-darwin]
image = "ghcr.io/messense/cross:arm64-linux-android"

[target.x86_64-pc-windows-gnu]
image = "x86_64-pc-windows-gnu:crosstool"

[target.aarch64-pc-windows-gnu]
image = "aarch64-pc-windows-gnu:crosstool"

# Default build image
[build.default]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main"

# Environment variables
[env]
CARGO_INCREMENTAL = "0"
