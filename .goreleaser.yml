# GoReleaser configuration for GitForge Rust CLI
# This is used for the gitforce-cli crate only
# For full multi-platform Rust builds, use: make build-cross-all
# See: https://goreleaser.com

project_name: gitforge-cli

version: 1

env:
  - CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse

before:
  hooks:
    - cargo fetch --locked

builds:
  - id: linux-amd64
    binary: gitforge
    main: ./crates/gitforce-cli/src/main.rs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - --release
    ldflags:
      - "-s -w"

  - id: linux-arm64
    binary: gitforge
    main: ./crates/gitforce-cli/src/main.rs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - --release
    ldflags:
      - "-s -w"

  - id: darwin-amd64
    binary: gitforge
    main: ./crates/gitforce-cli/src/main.rs
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
    flags:
      - --release
    ldflags:
      - "-s -w"

  - id: darwin-arm64
    binary: gitforge
    main: ./crates/gitforce-cli/src/main.rs
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - --release
    ldflags:
      - "-s -w"

  - id: windows-amd64
    binary: gitforge.exe
    main: ./crates/gitforce-cli/src/main.rs
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - --release
    ldflags:
      - "-s -w"

archives:
  - id: default
    format_overrides:
      - goos: windows
        format: zip
    files: []

checksums:
  algorithm: sha256

release:
  github:
    owner: aliasfoxkde
    name: GitForge
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^refactor:"
      - "^merge:"
