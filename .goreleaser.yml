# GoReleaser configuration for GitForge
# Multi-platform release builds for Linux, macOS, and Windows
# See: https://goreleaser.com

project_name: gitforge

version: 1

env:
  - CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse

before:
  hooks:
    - cargo fetch --locked

builds:
  - id: linux-amd64
    binary: gitforge
    main: ./crates/gitforce-cli/src/main.rs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - "-s -w"
    files: []

  - id: linux-arm64
    binary: gitforge
    main: ./crates/gitforce-cli/src/main.rs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - "-s -w"

  - id: darwin-amd64
    binary: gitforge
    main: ./crates/gitforce-cli/src/main.rs
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - "-s -w"

  - id: darwin-arm64
    binary: gitforge
    main: ./crates/gitforce-cli/src/main.rs
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - "-s -w"

  - id: windows-amd64
    binary: gitforge.exe
    main: ./crates/gitforce-cli/src/main.rs
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - "-s -w"

archives:
  - id: default
    format_overrides:
      - goos: windows
        format: zip
    files:
      - config.toml.example

checksums:
  algorithm: sha256

# Docker manifest for multi-platform builds
docker:
  - image_template: "gitforge/gitforge:{{ .Tag }}"
    ids:
      - linux-amd64

release:
  github:
    owner: gitforge
    name: gitforge
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^refactor:"
      - "^merge:"
