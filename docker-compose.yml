# GitForge Docker Compose
# Self-hosted Git platform with CI/CD

services:
  # =============================================================================
  # API Gateway
  # =============================================================================
  api:
    build:
      context: .
      target: api-prod
    container_name: gitforge-api
    ports:
      - "42780:42780"
    volumes:
      # Shared control-plane SQLite: api, ci, and git-server must observe the
      # same repositories for pushes and pipeline triggers to resolve.
      - gitforge-data:/data
      - git-data:/git
      - ./config.toml.example:/config.toml:ro
    environment:
      # mode=rwc lets the gateway create the database file on first boot;
      # bare sqlite: URLs are opened verbatim and require an existing file.
      - DATABASE_URL=sqlite:/data/gitforge.db?mode=rwc
      # Repos are provisioned here so git-server serves them from the same
      # volume (<GIT_ROOT>/<repo_id> is the StorageBackend layout).
      - GIT_ROOT=/git
      - RUST_LOG=info
      - JWT_SECRET=${JWT_SECRET:-changeme-in-production}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:42780/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      - git-server
    networks:
      - gitforge

  # =============================================================================
  # CI Orchestrator (includes Scheduler)
  # =============================================================================
  ci:
    build:
      context: .
      target: ci-prod
    container_name: gitforge-ci
    ports:
      - "42781:42781"
    volumes:
      - gitforge-data:/data
      # CI loads the committed .gitforce.yml from the pushed revision, so it
      # needs read access to the bare repositories.
      - git-data:/git:ro
      # Run workspaces must be a HOST directory bind-mounted at its own
      # absolute path: the runner's sandbox passes each job's working_dir to
      # the host Docker daemon as a bind source, and the daemon resolves it
      # against the HOST filesystem. The in-container path must therefore
      # equal the host path or jobs see an empty auto-created directory.
      - ${GITFORGE_WORKSPACE_HOST_DIR:?set GITFORGE_WORKSPACE_HOST_DIR to a host directory for CI checkouts in .env}:${GITFORGE_WORKSPACE_HOST_DIR:?set GITFORGE_WORKSPACE_HOST_DIR to a host directory for CI checkouts in .env}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GITFORGE_DATABASE_URL=sqlite:/data/gitforge.db?mode=rwc
      - GITFORGE_WORKSPACE_ROOT=${GITFORGE_WORKSPACE_HOST_DIR:?set GITFORGE_WORKSPACE_HOST_DIR to a host directory for CI checkouts in .env}
      - RUST_LOG=info
      # Scheduler API auth is fail-closed: runners cannot register, fetch, or
      # complete jobs unless this shared credential is configured.
      - GITFORGE_SCHEDULER_TOKEN=${GITFORGE_SCHEDULER_TOKEN:?set GITFORGE_SCHEDULER_TOKEN in .env}
    depends_on:
      - git-server
    networks:
      - gitforge

  # =============================================================================
  # Runner Agent
  # =============================================================================
  runner:
    build:
      context: .
      target: runner-prod
    container_name: gitforge-runner
    privileged: true  # Required for Docker-in-Docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-data:/data
      # Same host workspace directory as ci, at the same absolute path, so
      # job working_dir binds resolve on the host daemon (see ci service).
      - ${GITFORGE_WORKSPACE_HOST_DIR:?set GITFORGE_WORKSPACE_HOST_DIR to a host directory for CI checkouts in .env}:${GITFORGE_WORKSPACE_HOST_DIR:?set GITFORGE_WORKSPACE_HOST_DIR to a host directory for CI checkouts in .env}
    # The image runs as non-root (uid 1000); joining the host docker group
    # grants read/write on the mounted socket. Find yours with:
    #   stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to your host docker gid (stat -c %g /var/run/docker.sock) in .env}"
    environment:
      - RUST_LOG=info
      - GITFORGE_SCHEDULER_URL=http://ci:42781
      - GITFORGE_RUNNER_NAME=docker-runner-1
      - GITFORGE_RUNNER_CAPACITY=4
      - GITFORGE_SCHEDULER_TOKEN=${GITFORGE_SCHEDULER_TOKEN:?set GITFORGE_SCHEDULER_TOKEN in .env}
    depends_on:
      - ci
    networks:
      - gitforge

  # =============================================================================
  # Git SSH/HTTP Server
  # =============================================================================
  git-server:
    build:
      context: .
      target: git-server-prod
    container_name: gitforge-git-server
    ports:
      - "42022:42022"  # Git SSH
      - "42782:42782"  # Git Smart HTTP
    volumes:
      - git-data:/git
      - gitforge-data:/data
      - ssh-data:/home/gitforge/.ssh
    environment:
      - RUST_LOG=info
      - SSH_PORT=42022
      - HTTP_PORT=42782
      - GIT_ROOT=/git
      - DATABASE_URL=sqlite:/data/gitforge.db?mode=rwc
      # Pushes enqueue durable ci.trigger events; delivery posts them to the
      # CI orchestrator with the shared scheduler credential.
      - GITFORGE_CI_TRIGGER_URL=http://ci:42781/pipelines/trigger
      - GITFORGE_CI_TRIGGER_TOKEN=${GITFORGE_SCHEDULER_TOKEN:?set GITFORGE_SCHEDULER_TOKEN in .env}
    networks:
      - gitforge

  # =============================================================================
  # Additional Runners (scale horizontally)
  # =============================================================================
  runner-2:
    build:
      context: .
      target: runner-prod
    container_name: gitforge-runner-2
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner2-data:/data
      - ${GITFORGE_WORKSPACE_HOST_DIR:?set GITFORGE_WORKSPACE_HOST_DIR to a host directory for CI checkouts in .env}:${GITFORGE_WORKSPACE_HOST_DIR:?set GITFORGE_WORKSPACE_HOST_DIR to a host directory for CI checkouts in .env}
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to your host docker gid (stat -c %g /var/run/docker.sock) in .env}"
    environment:
      - RUST_LOG=info
      - GITFORGE_SCHEDULER_URL=http://ci:42781
      - GITFORGE_RUNNER_NAME=docker-runner-2
      - GITFORGE_RUNNER_CAPACITY=2
      - GITFORGE_SCHEDULER_TOKEN=${GITFORGE_SCHEDULER_TOKEN:?set GITFORGE_SCHEDULER_TOKEN in .env}
    depends_on:
      - ci
    networks:
      - gitforge
    deploy:
      replicas: 0  # Set to 1 to enable second runner

# =============================================================================
# Volumes
# =============================================================================
volumes:
  gitforge-data:
    driver: local
  runner-data:
    driver: local
  runner2-data:
    driver: local
  git-data:
    driver: local
  ssh-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  gitforge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
